aid: hum-capital
name: Hum Capital
description: 'Hum Capital operates an AI-powered funding marketplace that connects growth companies
  with the right institutional capital. Through its Intelligent Capital Market platform, companies
  share their financial and operating data once and are matched to a network of 900+ lenders and
  investors for non-dilutive and structured financing (typically $1M-$50M), while investors receive
  curated, data-driven deal flow. Hum reports more than $700M in capital deployed across 6,000+
  companies. Headquartered in New York, the company operates in the financial services, capital
  markets, and alternative-financing sector. This API Evangelist profile was surfaced as a portfolio
  company of Partech and enriched from the company''s public web surface; Hum publishes no public
  developer API, so this entry is identity- and security-focused.'
